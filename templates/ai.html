<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAI - MySpace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 270px;
            background: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid #ddd;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .new-chat:hover {
            background: #374151;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px;
            margin-bottom: 5px;
            border-radius: 9px;
            cursor: pointer;
        }

        .chat-item:hover {
            background: #f0f0f0;
        }

        .chat-item.active {
            background: #e5e7eb;
        }

        .chat-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .delete-chat {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
        }

        .delete-chat:hover {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid #ddd;
        }

        .back-link {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 10px;
            border-radius: 8px;
        }

        .back-link:hover {
            background: #f0f0f0;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 65px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 22px;
            font-size: 20px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .welcome {
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #666;
            font-size: 17px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 18px auto;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 15px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user .bubble {
            background: #111827;
            color: white;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #ddd;
            color: #222;
        }

        /* INPUT */

        .input-area {
            background: white;
            border-top: 1px solid #ddd;
            padding: 15px;
        }

        .input-box {
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 13px;
            font-family: inherit;
            font-size: 15px;
            min-height: 48px;
            max-height: 140px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #888;
        }

        #sendButton {
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            padding: 0 20px;
            cursor: pointer;
            font-size: 15px;
        }

        #sendButton:hover {
            background: #374151;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing {
            color: #777;
            font-style: italic;
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 210px;
            }

            .bubble {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="brand">
                🧠 MyAI
            </div>

            <button class="new-chat" onclick="newChat()">
                ➕ New Chat
            </button>

        </div>

        <div id="chatList" class="chat-list">
            <div style="padding:15px;color:#777;">
                Loading chats...
            </div>
        </div>

        <div class="sidebar-footer">

            <a href="/" class="back-link">
                ← Back to MySpace
            </a>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <div class="topbar">
            🧠 MyAI
        </div>

        <div id="messages" class="messages">

            <div class="welcome" id="welcome">

                <h1>👋 Hi{{ " " + username if username else "" }}!</h1>

                <p>
                    I'm MyAI, your AI assistant inside MySpace.
                </p>

                <p>
                    Ask me anything, get help with coding,
                    schoolwork, or search the internet.
                </p>

            </div>

        </div>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message MyAI..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button id="sendButton" onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </main>

</div>

<script>

let currentConversationId = null;
let sending = false;


/* =========================
   LOAD CHAT LIST
========================= */

async function loadChats() {

    try {

        const response = await fetch("/api/conversations");

        if (!response.ok) {
            throw new Error("Could not load chats");
        }

        const chats = await response.json();

        const list = document.getElementById("chatList");

        list.innerHTML = "";

        if (!chats.length) {

            list.innerHTML = `
                <div style="padding:15px;color:#777;">
                    No chats yet.
                </div>
            `;

            return;
        }

        chats.forEach(chat => {

            const item = document.createElement("div");

            item.className = "chat-item";

            if (chat.id === currentConversationId) {
                item.classList.add("active");
            }

            item.innerHTML = `
                <span>💬</span>
                <span class="chat-title">${escapeHtml(chat.title)}</span>
                <button
                    class="delete-chat"
                    onclick="deleteChat(event, ${chat.id})"
                    title="Delete chat"
                >
                    🗑️
                </button>
            `;

            item.onclick = function() {
                loadChat(chat.id);
            };

            list.appendChild(item);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("chatList").innerHTML = `
            <div style="padding:15px;color:#c00;">
                Could not load chats.
            </div>
        `;
    }
}


/* =========================
   NEW CHAT
========================= */

async function newChat() {

    try {

        const response = await fetch("/api/conversations", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: "New Chat"
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Could not create chat.");
            return;
        }

        currentConversationId = data.id;

        clearMessages();

        await loadChats();

        document.getElementById("messageInput").focus();

    } catch (error) {

        console.error(error);

        alert("Could not create a new chat.");

    }
}


/* =========================
   LOAD CHAT
========================= */

async function loadChat(id) {

    try {

        const response = await fetch(
            `/api/conversations/${id}`
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Could not load chat.");
            return;
        }

        currentConversationId = id;

        const messages = document.getElementById("messages");

        messages.innerHTML = "";

        if (!data.messages.length) {

            showWelcome();

        } else {

            data.messages.forEach(message => {

                addMessage(
                    message.role,
                    message.content
                );

            });

        }

        await loadChats();

        scrollToBottom();

    } catch (error) {

        console.error(error);

        alert("Could not load this chat.");

    }
}


/* =========================
   DELETE CHAT
========================= */

async function deleteChat(event, id) {

    event.stopPropagation();

    if (!confirm("Delete this chat?")) {
        return;
    }

    try {

        const response = await fetch(
            `/api/conversations/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Could not delete chat.");
            return;
        }

        if (currentConversationId === id) {

            currentConversationId = null;

            clearMessages();

        }

        await loadChats();

    } catch (error) {

        console.error(error);

        alert("Could not delete chat.");

    }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    if (sending) {
        return;
    }

    const input = document.getElementById("messageInput");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    sending = true;

    document.getElementById("sendButton").disabled = true;

    if (!currentConversationId) {

        try {

            const response = await fetch(
                "/api/conversations",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: message.substring(0, 50)
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Could not create chat"
                );
            }

            currentConversationId = data.id;

            await loadChats();

        } catch (error) {

            alert(error.message);

            sending = false;

            document.getElementById("sendButton").disabled = false;

            return;
        }
    }

    hideWelcome();

    addMessage("user", message);

    input.value = "";

    const typing = document.createElement("div");

    typing.className = "typing";

    typing.id = "typing";

    typing.textContent = "MyAI is thinking...";

    document.getElementById("messages").appendChild(typing);

    scrollToBottom();

    try {

        const response = await fetch(
            "/api/ai",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    conversation_id: currentConversationId
                })
            }
        );

        const data = await response.json();

        const oldTyping = document.getElementById("typing");

        if (oldTyping) {
            oldTyping.remove();
        }

        if (!response.ok) {
            throw new Error(
                data.error || "MyAI returned an error."
            );
        }

        addMessage(
            "assistant",
            data.answer || "I didn't get an answer."
        );

        await loadChats();

    } catch (error) {

        const oldTyping = document.getElementById("typing");

        if (oldTyping) {
            oldTyping.remove();
        }

        addMessage(
            "assistant",
            "⚠️ " + error.message
        );

    }

    sending = false;

    document.getElementById("sendButton").disabled = false;

    input.focus();

    scrollToBottom();
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(role, content) {

    const messages = document.getElementById("messages");

    const wrapper = document.createElement("div");

    wrapper.className =
        "message " +
        (role === "user" ? "user" : "assistant");

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = content;

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

}


/* =========================
   CLEAR
========================= */

function clearMessages() {

    document.getElementById("messages").innerHTML = "";

    showWelcome();

}


function showWelcome() {

    document.getElementById("messages").innerHTML = `
        <div class="welcome" id="welcome">

            <h1>👋 Hi{{ " " + username if username else "" }}!</h1>

            <p>
                I'm MyAI, your AI assistant inside MySpace.
            </p>

            <p>
                Ask me anything, get help with coding,
                schoolwork, or search the internet.
            </p>

        </div>
    `;
}


function hideWelcome() {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

}


/* =========================
   ENTER KEY
========================= */

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    const messages = document.getElementById("messages");

    messages.scrollTop = messages.scrollHeight;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================
   START
========================= */

loadChats();

</script>

</body>
</html>
