<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAI - MySpace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #ddd;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .new-chat:hover {
            background: #444;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .chat-item:hover {
            background: #f0f0f0;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 65px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 20px auto;
            padding: 15px 18px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #222;
            color: white;
        }

        .ai {
            background: white;
            border: 1px solid #ddd;
        }

        .sources {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 13px;
        }

        .sources a {
            color: #2563eb;
            text-decoration: none;
        }

        .sources a:hover {
            text-decoration: underline;
        }

        .input-area {
            background: white;
            border-top: 1px solid #ddd;
            padding: 15px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #sendButton {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #sendButton:hover {
            background: #444;
        }

        #sendButton:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 100px;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 190px;
            }

            .messages {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">🤖 MyAI</div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div id="chatList" class="chat-list"></div>
    </aside>

    <main class="main">

        <div class="header">
            MyAI
        </div>

        <div id="messages" class="messages">
            <div class="empty" id="emptyMessage">
                <h2>👋 Hi!</h2>
                <p>I'm MyAI, your assistant inside MySpace.</p>
                <p>Ask me anything.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Ask MyAI anything..."
                    autocomplete="off"
                >

                <button id="sendButton" onclick="sendMessage()">
                    Send
                </button>

            </div>
        </div>

    </main>

</div>

<script>

let messages = [];

const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const messagesDiv = document.getElementById("messages");
const emptyMessage = document.getElementById("emptyMessage");


function addMessage(text, type, sources = []) {

    if (emptyMessage) {
        emptyMessage.remove();
    }

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    messagesDiv.appendChild(div);

    if (sources && sources.length > 0) {

        const sourceBox = document.createElement("div");

        sourceBox.className = "sources";

        const title = document.createElement("strong");

        title.textContent = "Sources:";

        sourceBox.appendChild(title);

        sources.forEach(source => {

            const row = document.createElement("div");

            row.style.marginTop = "6px";

            const link = document.createElement("a");

            link.href = source.url || "#";

            link.target = "_blank";

            link.rel = "noopener noreferrer";

            link.textContent = source.title || source.url || "Source";

            row.appendChild(link);

            sourceBox.appendChild(row);

        });

        div.appendChild(sourceBox);
    }

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}


async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    sendButton.disabled = true;

    sendButton.textContent = "Thinking...";

    try {

        const response = await fetch("/api/ai", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const responseText = await response.text();

        console.log("MyAI API status:", response.status);
        console.log("MyAI API response:", responseText);

        let data;

        try {
            data = JSON.parse(responseText);
        } catch (jsonError) {

            console.error("JSON parsing failed:", jsonError);
            console.error("Server returned:", responseText);

            throw new Error(
                "The MyAI server did not return valid JSON."
            );
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "MyAI returned an error."
            );
        }

        const answer =
            data.answer ||
            data.response ||
            data.reply ||
            "MyAI did not return an answer.";

        addMessage(
            answer,
            "ai",
            data.sources || []
        );

    } catch (error) {

        console.error("MyAI error:", error);

        addMessage(
            "Sorry, MyAI had a problem: " + error.message,
            "ai"
        );

    } finally {

        sendButton.disabled = false;

        sendButton.textContent = "Send";

        input.focus();
    }
}


function newChat() {

    messagesDiv.innerHTML = `
        <div class="empty" id="emptyMessage">
            <h2>👋 Hi!</h2>
            <p>I'm MyAI, your assistant inside MySpace.</p>
            <p>Ask me anything.</p>
        </div>
    `;

    input.value = "";

    input.focus();
}


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }

});


input.focus();

</script>

</body>
</html>
