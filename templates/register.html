<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MySpace - Create Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #191919;
            color: white;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 370px;
            max-width: 90%;

            background: #202020;

            padding: 35px;

            border-radius: 16px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: 1px solid #383838;
            border-radius: 8px;

            background: #303030;
            color: white;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #4f8cff;
        }

        button {
            width: 100%;

            margin-top: 15px;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .bottom {
            margin-top: 20px;
            text-align: center;
            color: #888;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            background: #402020;
            color: #ff8b8b;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="logo">
        🚀 MySpace
    </div>

    <div class="subtitle">
        Create your workspace
    </div>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="new-password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>

</html>
