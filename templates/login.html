<!DOCTYPE html>
<html>

<head>

    <title>MySpace Login</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 350px;
            padding: 35px;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .error {
            background: #ffe0e0;
            color: #a00000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .register {
            text-align: center;
            margin-top: 18px;
        }

        a {
            color: #333;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>🏠 MySpace</h1>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register">

        Don't have an account?

        <a href="/register">
            Create an account
        </a>

    </div>

</div>

</body>

</html>
